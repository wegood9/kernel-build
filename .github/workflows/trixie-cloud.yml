name: Build Debian Trixie Cloud Kernel (no container)

on:
  workflow_dispatch:
    inputs:
      build_official_signed:
        description: "Also build official linux-signed-amd64 source package artifacts (separate; no config.sh)"
        required: false
        type: boolean
        default: false
  push:
    paths:
      - ".github/workflows/build-debian-trixie-cloud.yml"
      - "config.sh"

permissions:
  contents: read

env:
  CHROOT_DIR: /srv/trixie

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 420

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          set -eux
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android || true
          sudo apt-get clean || true
          df -h

      - name: Install host prerequisites
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            debootstrap ca-certificates

      - name: Bootstrap Debian trixie chroot
        run: |
          set -euxo pipefail
          sudo mkdir -p "${CHROOT_DIR}"
          sudo debootstrap --variant=minbase trixie "${CHROOT_DIR}" http://deb.debian.org/debian

          # Need deb-src for build-dep / apt source
          sudo tee "${CHROOT_DIR}/etc/apt/sources.list" >/dev/null <<'EOF'
          deb http://deb.debian.org/debian trixie main
          deb-src http://deb.debian.org/debian trixie main
          EOF

          # Bind mounts for chroot operation + workspace access
          sudo mkdir -p "${CHROOT_DIR}/proc" "${CHROOT_DIR}/sys" "${CHROOT_DIR}/dev/pts" "${CHROOT_DIR}/work"
          sudo mount -t proc proc "${CHROOT_DIR}/proc"
          sudo mount -t sysfs sys "${CHROOT_DIR}/sys"
          sudo mount --bind /dev "${CHROOT_DIR}/dev"
          sudo mount --bind /dev/pts "${CHROOT_DIR}/dev/pts"
          sudo mount --bind "$GITHUB_WORKSPACE" "${CHROOT_DIR}/work"

      - name: Build custom cloud kernel + optional official signed artifacts
        env:
          BUILD_OFFICIAL_SIGNED: ${{ github.event.inputs.build_official_signed || 'false' }}
        run: |
          set -euxo pipefail
          chmod +x config.sh || true

          sudo --preserve-env=BUILD_OFFICIAL_SIGNED chroot "${CHROOT_DIR}" /bin/bash <<'CHROOT'
          set -euxo pipefail
          export DEBIAN_FRONTEND=noninteractive

          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            build-essential fakeroot devscripts dpkg-dev debhelper \
            bc bison flex kmod cpio rsync file git \
            xz-utils zstd quilt python3 \
            libelf-dev libssl-dev libncurses-dev dwarves \
            equivs

          # -------- Custom build from official Debian linux source --------
          apt-get build-dep -y linux

          mkdir -p /work/build /work/out/custom /work/out/official-signed
          cd /work/build

          apt-get source linux
          SRC_DIR="$(find . -maxdepth 1 -type d -name 'linux-*' | sort -V | tail -n1)"
          test -n "${SRC_DIR}"
          cd "${SRC_DIR}"

          export MAKEFLAGS="-j$(nproc)"
          export DEB_RULES_REQUIRES_ROOT=no
          # reduce space/time
          export DEB_BUILD_PROFILES="pkg.linux.nokerneldbg pkg.linux.nokerneldbginfo"

          ARCH=amd64
          FEATURESET=none
          FLAVOUR=cloud
          BUILD_DIR="debian/build/build_${ARCH}_${FEATURESET}_${FLAVOUR}"

          debian/rules source
          make -f debian/rules.gen "setup_${ARCH}_${FEATURESET}_${FLAVOUR}"

          # Apply repo config.sh on top of flavour config
          cp "${BUILD_DIR}/.config" .config
          bash /work/config.sh
          cp .config "${BUILD_DIR}/.config"

          # Fill any new symbols introduced by config changes
          make -C "${BUILD_DIR}" olddefconfig

          # Build only cloud flavour + indep common headers metadata
          make -f debian/rules.gen "binary-arch_${ARCH}_${FEATURESET}_${FLAVOUR}"
          make -f debian/rules.gen "binary-indep_${FEATURESET}" || true

          cd /work/build

          # Copy custom artifacts
          find . -maxdepth 1 -type f \( -name '*.deb' -o -name '*.changes' -o -name '*.buildinfo' -o -name '*.dsc' \) \
            -exec cp -vf {} /work/out/custom/ \; || true
          cp -vf "${SRC_DIR}/${BUILD_DIR}/.config" /work/out/custom/cloud-amd64.final.config || true

          # Create local meta packages (cloud-amd64 style) that depend on built binaries
          IMG_DEB="$(ls -1 /work/out/custom/linux-image-*cloud-amd64*.deb 2>/dev/null | grep -Ev 'dbgsym|dbg' | head -n1 || true)"
          HDR_DEB="$(ls -1 /work/out/custom/linux-headers-*cloud-amd64*.deb 2>/dev/null | grep -Ev 'dbgsym|dbg' | head -n1 || true)"
          COM_DEB="$(ls -1 /work/out/custom/linux-headers-*common*.deb 2>/dev/null | grep -Ev 'dbgsym|dbg' | head -n1 || true)"

          if [ -n "${IMG_DEB}" ]; then
            IMG_PKG="$(dpkg-deb -f "${IMG_DEB}" Package)"
            cat > /tmp/linux-image-cloud-amd64-custom.control <<EOF
          Section: misc
          Priority: optional
          Standards-Version: 4.6.0
          Package: linux-image-cloud-amd64-custom
          Version: 1.0
          Maintainer: CI Builder <ci@example.invalid>
          Depends: ${IMG_PKG}
          Architecture: all
          Description: Custom cloud kernel metapackage (depends on CI-built image)
           Local metapackage generated in CI.
          EOF
            equivs-build /tmp/linux-image-cloud-amd64-custom.control
            cp -vf /tmp/linux-image-cloud-amd64-custom_*_all.deb /work/out/custom/ || true
          fi

          if [ -n "${HDR_DEB}" ]; then
            HDR_PKG="$(dpkg-deb -f "${HDR_DEB}" Package)"
            DEP_LINE="${HDR_PKG}"
            if [ -n "${COM_DEB}" ]; then
              COM_PKG="$(dpkg-deb -f "${COM_DEB}" Package)"
              DEP_LINE="${DEP_LINE}, ${COM_PKG}"
            fi

            cat > /tmp/linux-headers-cloud-amd64-custom.control <<EOF
          Section: misc
          Priority: optional
          Standards-Version: 4.6.0
          Package: linux-headers-cloud-amd64-custom
          Version: 1.0
          Maintainer: CI Builder <ci@example.invalid>
          Depends: ${DEP_LINE}
          Architecture: all
          Description: Custom cloud headers metapackage (depends on CI-built headers)
           Local metapackage generated in CI.
          EOF
            equivs-build /tmp/linux-headers-cloud-amd64-custom.control
            cp -vf /tmp/linux-headers-cloud-amd64-custom_*_all.deb /work/out/custom/ || true
          fi

          # -------- Optional: official signed source package build --------
          if [ "${BUILD_OFFICIAL_SIGNED}" = "true" ]; then
            apt-get build-dep -y linux-signed-amd64 || true
            cd /work/build
            apt-get source linux-signed-amd64 || true

            SSRC_DIR="$(find . -maxdepth 1 -type d -name 'linux-signed-amd64-*' | sort -V | tail -n1 || true)"
            if [ -n "${SSRC_DIR}" ]; then
              cd "${SSRC_DIR}"
              dpkg-buildpackage -b -uc -us || true
              cd /work/build
              find . -maxdepth 1 -type f \( -name '*.deb' -o -name '*.changes' -o -name '*.buildinfo' -o -name '*.dsc' \) \
                -exec cp -vf {} /work/out/official-signed/ \; || true
            fi
          fi
          CHROOT

      - name: Unmount chroot mounts
        if: always()
        run: |
          set -eux
          sudo umount "${CHROOT_DIR}/work" || true
          sudo umount "${CHROOT_DIR}/dev/pts" || true
          sudo umount "${CHROOT_DIR}/dev" || true
          sudo umount "${CHROOT_DIR}/sys" || true
          sudo umount "${CHROOT_DIR}/proc" || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debian-trixie-cloud-kernel
          path: |
            out/custom/*
            out/official-signed/*
          if-no-files-found: warn

name: Debian Trixie Cloud Kernel

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Create GitHub release"
        required: false
        default: "true"
      keep_releases:
        description: "How many releases to keep"
        required: false
        default: "5"
      run_config_sh:
        description: "Run repo root config.sh before build"
        required: false
        default: "true"
      config_fragment_path:
        description: "Persistent config fragment (repo-relative or absolute)"
        required: false
        default: "debian-trixie-cloud.cfg"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write

    container:
      image: debian:trixie

    defaults:
      run:
        shell: bash

    env:
      DEBIAN_FRONTEND: noninteractive
      DEB_BUILD_OPTIONS: nocheck
      DEB_BUILD_PROFILES: pkg.linux.nokerneldbg pkg.linux.nokerneldbginfo
      DEB_RULES_REQUIRES_ROOT: "no"
      KERNEL_SOURCE_PKG: linux

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show system info
        run: |
          set -euo pipefail
          uname -a
          echo "CPU cores: $(nproc)"
          df -h

      - name: Configure APT sources (enable deb-src)
        run: |
          set -euo pipefail
          cat > /etc/apt/sources.list <<'EOF'
          deb http://deb.debian.org/debian trixie main contrib non-free-firmware non-free
          deb-src http://deb.debian.org/debian trixie main contrib non-free-firmware non-free
          deb http://deb.debian.org/debian trixie-updates main contrib non-free-firmware non-free
          deb-src http://deb.debian.org/debian trixie-updates main contrib non-free-firmware non-free
          deb http://security.debian.org/debian-security trixie-security main contrib non-free-firmware non-free
          deb-src http://security.debian.org/debian-security trixie-security main contrib non-free-firmware non-free
          EOF
          apt-get update

      - name: Install build tooling and deps
        run: |
          set -euo pipefail
          apt-get install -y --no-install-recommends \
            ca-certificates gnupg dirmngr \
            build-essential fakeroot dpkg-dev devscripts equivs \
            git rsync wget curl xz-utils zstd cpio quilt ccache \
            bc bison flex libelf-dev libssl-dev libncurses-dev dwarves \
            python3
          apt-get build-dep -y "$KERNEL_SOURCE_PKG"

      - name: Download Debian linux source
        run: |
          set -euo pipefail
          apt-get source "$KERNEL_SOURCE_PKG"

          SRC_DIR="$(find . -maxdepth 1 -type d -name 'linux-*' | sort | head -n1)"
          if [[ -z "${SRC_DIR:-}" ]]; then
            echo "ERROR: linux source directory not found."
            exit 1
          fi

          PKG_DIR="$(dirname "$SRC_DIR")"
          [[ -d "$PKG_DIR" ]] || PKG_DIR="."

          echo "SRC_DIR=$SRC_DIR" >> "$GITHUB_ENV"
          echo "PKG_DIR=$PKG_DIR" >> "$GITHUB_ENV"
          echo "BUILD_TARGET=unknown" >> "$GITHUB_ENV"

          echo "Source dir: $SRC_DIR"
          echo "Package output dir: $PKG_DIR"

      - name: Optional local patch (debian-cloud.patch)
        run: |
          set -euo pipefail
          if [[ -f "$GITHUB_WORKSPACE/debian-cloud.patch" ]]; then
            echo "Applying debian-cloud.patch"
            patch -d "$SRC_DIR" -p1 < "$GITHUB_WORKSPACE/debian-cloud.patch"
          else
            echo "No debian-cloud.patch found, continue."
          fi

      - name: Run config.sh (optional)
        run: |
          set -euo pipefail

          if [[ "${{ inputs.run_config_sh }}" != "true" ]]; then
            echo "run_config_sh=false, skipping config.sh"
            exit 0
          fi

          if [[ ! -f "$GITHUB_WORKSPACE/config.sh" ]]; then
            echo "WARNING: run_config_sh=true but config.sh not found at repo root; skipping."
            exit 0
          fi

          chmod +x "$GITHUB_WORKSPACE/config.sh"
          cd "$SRC_DIR"
          bash "$GITHUB_WORKSPACE/config.sh"

      - name: Sanitize source tree for Debian packaging
        run: |
          set -euo pipefail
          cd "$SRC_DIR"

          # Fix: Debian out-of-tree build requires clean source tree
          make mrproper || true

          # extra cleanup for leftovers
          rm -rf \
            debian/build debian/stamps \
            .config .config.old .version .old_version \
            Module.symvers System.map vmlinux \
            include/config include/generated \
            .tmp_versions \
            output signing_key.pem certs/signing_key.pem

          test ! -e .config || (echo "ERROR: .config still exists"; exit 1)
          test ! -d include/generated || (echo "ERROR: include/generated still exists"; exit 1)

      - name: Apply persistent Debian config fragment
        run: |
          set -euo pipefail
          cd "$SRC_DIR"

          FRAG_INPUT="${{ inputs.config_fragment_path }}"
          if [[ "$FRAG_INPUT" = /* ]]; then
            FRAG="$FRAG_INPUT"
          else
            FRAG="$GITHUB_WORKSPACE/$FRAG_INPUT"
          fi

          # Auto-create default fragment if missing
          if [[ ! -f "$FRAG" ]]; then
            echo "WARN: config fragment not found at $FRAG"
            FRAG="/tmp/debian-trixie-cloud.cfg"
            cat > "$FRAG" <<'EOF'
# Auto-generated default fragment
CONFIG_BBR=y
CONFIG_HZ_1000=y
# CONFIG_DEBUG_INFO is not set
EOF
            echo "Using auto-generated fragment: $FRAG"
          fi

          python3 - "$FRAG" <<'PY'
          import re
          import sys
          from pathlib import Path

          frag_path = Path(sys.argv[1])
          root = Path(".")

          # -------- parse fragment --------
          raw_lines = frag_path.read_text(encoding="utf-8").splitlines()
          normalized = []
          order = []

          for raw in raw_lines:
              s = raw.strip()
              if not s:
                  continue

              m_set = re.match(r'^(CONFIG_[A-Za-z0-9_]+)=(.*)$', s)
              if m_set:
                  k, v = m_set.group(1), m_set.group(2)
                  normalized.append((k, f"{k}={v}"))
                  order.append(k)
                  continue

              m_unset = re.match(r'^#\s*(CONFIG_[A-Za-z0-9_]+)\s+is not set$', s)
              if m_unset:
                  k = m_unset.group(1)
                  normalized.append((k, f"# {k} is not set"))
                  order.append(k)
                  continue

              if s.startswith("#"):
                  continue

              raise SystemExit(f"Invalid fragment line: {raw!r}")

          if not normalized:
              raise SystemExit("No valid CONFIG lines found in fragment.")

          # de-dup by key, keep first appearance order
          seen = set()
          final_items = []
          for k, line in normalized:
              if k in seen:
                  continue
              seen.add(k)
              final_items.append((k, line))

          keys = [k for k, _ in final_items]

          # -------- discover target config files --------
          targets = []

          # Always include base amd64 config if exists
          base = root / "debian/config/amd64/config"
          if base.exists():
              targets.append(base)

          # Include any amd64 cloud-related config files
          for p in sorted((root / "debian/config").rglob("config")):
              sp = str(p).lower()
              if "amd64" in sp and "cloud" in sp and p not in targets:
                  targets.append(p)

          if not targets:
              raise SystemExit("No Debian config targets found (expected debian/config/amd64/config).")

          begin = "# --- BEGIN CI PERSISTENT FRAGMENT ---"
          end = "# --- END CI PERSISTENT FRAGMENT ---"

          # regex for removing existing key assignments
          key_patterns = []
          for k in keys:
              key_patterns.append(re.compile(rf'^{re.escape(k)}='))
              key_patterns.append(re.compile(rf'^#\s*{re.escape(k)}\s+is not set$'))

          def strip_old_block(lines):
              out = []
              inside = False
              for line in lines:
                  s = line.strip()
                  if s == begin:
                      inside = True
                      continue
                  if s == end:
                      inside = False
                      continue
                  if not inside:
                      out.append(line)
              return out

          for t in targets:
              lines = t.read_text(encoding="utf-8").splitlines()
              lines = strip_old_block(lines)

              out = []
              for line in lines:
                  s = line.strip()
                  if any(pat.match(s) for pat in key_patterns):
                      continue
                  out.append(line)

              out.append("")
              out.append(begin)
              for _, line in final_items:
                  out.append(line)
              out.append(end)
              out.append("")

              t.write_text("\n".join(out), encoding="utf-8")
              print(f"Applied {len(final_items)} entries to {t}")

          print(f"Fragment source: {frag_path}")
          PY

          echo "------ Effective fragment ------"
          cat "$FRAG"
          echo "--------------------------------"

      - name: Build cloud flavor kernel packages
        run: |
          set -euo pipefail
          cd "$SRC_DIR"
          export MAKEFLAGS="-j$(nproc)"

          # Regenerate packaging metadata from debian/config/*
          make -f debian/rules source

          BUILT=0
          for TARGET in \
            binary-arch_amd64_none_cloud-amd64 \
            binary-arch_amd64_none_cloud \
            binary-arch_amd64_none_amd64
          do
            echo "Trying target: $TARGET"
            if make -f debian/rules.gen "$TARGET"; then
              BUILT=1
              echo "BUILD_TARGET=$TARGET" >> "$GITHUB_ENV"
              break
            fi
          done

          if [[ "$BUILT" -ne 1 ]]; then
            echo "Cloud target not matched; fallback to dpkg-buildpackage -B"
            dpkg-buildpackage -B -uc -us
            echo "BUILD_TARGET=dpkg-buildpackage -B" >> "$GITHUB_ENV"
          fi

      - name: Collect artifacts
        run: |
          set -euo pipefail
          mkdir -p artifacts

          find "$PKG_DIR" -maxdepth 1 -type f \
            \( -name 'linux-image-*cloud*amd64*.deb' \
               -o -name 'linux-headers-*cloud*amd64*.deb' \
               -o -name 'linux-libc-dev_*amd64*.deb' \
               -o -name '*.buildinfo' \
               -o -name '*.changes' \) \
            -exec mv -v {} artifacts/ \;

          if ! find artifacts -maxdepth 1 -type f -name '*.deb' | grep -q .; then
            echo "No cloud .deb found; collecting generic kernel .deb files."
            find "$PKG_DIR" -maxdepth 1 -type f \
              \( -name 'linux-image-*.deb' \
                 -o -name 'linux-headers-*.deb' \
                 -o -name 'linux-libc-dev_*.deb' \) \
              -exec mv -v {} artifacts/ \;
          fi

          # Save one generated effective .config (best effort)
          find "$SRC_DIR/debian/build" -type f -name '.config' -print -quit | while IFS= read -r cfg; do
            cp "$cfg" "artifacts/config-${GITHUB_RUN_ID}"
          done || true

          ls -lah artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debian-trixie-cloud-kernel-${{ github.run_id }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub release
        if: ${{ inputs.release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debian-trixie-cloud-${{ github.run_id }}
          name: Debian Trixie Cloud Kernel (${{ env.BUILD_TARGET }})
          files: artifacts/*
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete old workflow runs
        if: always()
        uses: Mattraks/delete-workflow-runs@main
        with:
          retain_days: 30
          keep_minimum_runs: 5

      - name: Delete old releases
        if: always()
        uses: dev-drprasad/delete-older-releases@master
        with:
          keep_latest: ${{ inputs.keep_releases }}
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

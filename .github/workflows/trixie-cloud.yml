name: Build Debian Trixie Cloud Kernel (Native)

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: 'Kernel Version to build (e.g., 6.12.13)'
        required: true
        default: '6.12.13'
  push:
    branches:
      - main
    paths:
      - 'config.sh'
      - '.github/workflows/debian-trixie-cloud-native.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    
    env:
      DEBIAN_FRONTEND: noninteractive
      KERNEL_VERSION: ${{ github.event.inputs.kernel_version || '6.12.13' }}

    steps:
      - name: Checkout Repository (Get config.sh)
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential fakeroot libncurses-dev bison flex libssl-dev libelf-dev \
          dwarves git bc rsync wget ca-certificates debhelper python3 kmod cpio \
          pahole

      - name: Download & Unpack Kernel Source
        run: |
          echo "Downloading Kernel $KERNEL_VERSION..."
          # Fetch the specified Mainline kernel version
          major_version=$(echo $KERNEL_VERSION | cut -d. -f1)
          wget -q https://cdn.kernel.org/pub/linux/kernel/v$major_version.x/linux-$KERNEL_VERSION.tar.xz
          
          echo "Unpacking..."
          tar -xf linux-$KERNEL_VERSION.tar.xz
          mv linux-$KERNEL_VERSION linux-src

      - name: Fetch Debian Cloud Configuration
        run: |
          cd linux-src
          
          echo "Fetching Debian configuration from Salsa (Sid/Trixie)..."
          # We fetch the config used for 'amd64' from the Debian Sid branch (which tracks Trixie/Unstable)
          wget -O .config https://salsa.debian.org/kernel-team/linux/-/raw/sid/debian/config/amd64/config.amd64_none_amd64
          
          # Fix common build failures for custom kernels by disabling trusted keys requirements
          # (These keys only exist on official Debian build servers)
          scripts/config --disable SYSTEM_TRUSTED_KEYS
          scripts/config --disable SYSTEM_REVOCATION_KEYS
          
          # Set a custom local version tag
          scripts/config --set-str LOCALVERSION "-trixie-cloud"
          
          # update config to new kernel version defaults
          make olddefconfig

      - name: Apply Custom Config (config.sh)
        run: |
          cd linux-src
          
          # Copy your config.sh into the source directory
          cp ../config.sh .
          chmod +x config.sh
          
          echo "Running config.sh..."
          ./config.sh
          
          # Finalize configuration
          make olddefconfig

      - name: Build Kernel (Debian Package)
        run: |
          cd linux-src
          
          # Disable Debug Info to prevent disk space exhaustion on GitHub Runner (Critical for non-container builds)
          scripts/config --disable DEBUG_INFO
          scripts/config --disable DEBUG_INFO_BTF
          scripts/config --enable DEBUG_INFO_NONE
          
          # Build the .deb packages
          # -j$(nproc) uses all available CPU cores
          # bindeb-pkg creates the debian package structure automatically
          make -j$(nproc) bindeb-pkg LOCALVERSION=-trixie-cloud

          # Organize artifacts
          mkdir -p ../build-artifacts
          mv ../*.deb ../build-artifacts/
          mv ../*.changes ../build-artifacts/ 2>/dev/null || true
          mv ../*.buildinfo ../build-artifacts/ 2>/dev/null || true

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debian-trixie-cloud-kernel-${{ env.KERNEL_VERSION }}
          path: build-artifacts/*
          compression-level: 0

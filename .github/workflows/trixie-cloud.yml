name: Build Debian Trixie Cloud Kernel

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'config.sh'
      - '.github/workflows/debian-trixie-cloud.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    container: debian:trixie
    
    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Enable Source Repositories
        run: |
          # The standard debian docker image has deb-src commented out.
          # We must enable it to fetch the kernel source.
          sed -i 's/^# deb-src/deb-src/' /etc/apt/sources.list
          cat /etc/apt/sources.list # Verify the change

      - name: Install Dependencies
        run: |
          apt-get update
          # Install build dependencies for the kernel
          apt-get build-dep -y linux
          # Install tools needed for the workflow and packaging
          apt-get install -y build-essential fakeroot libncurses-dev bison flex libssl-dev libelf-dev \
          dwarves git bc rsync wget ca-certificates debhelper python3 kmod cpio \
          pahole kernel-wedge quilt

      - name: Fetch Debian Trixie Kernel Source
        run: |
          echo "Fetching source via apt..."
          # This downloads the source, unpacks it, and applies Debian patches automatically.
          # It guarantees you get the exact kernel version intended for Trixie.
          apt-get source linux
          
          # Rename the directory to a generic name for the next steps
          mv linux-* linux-src
          ls -lh linux-src

      - name: Prepare Cloud Configuration
        run: |
          cd linux-src
          
          # We base our config on the current Debian configuration.
          # apt-get source usually includes the debian/ folder with configs.
          # We can grab the amd64 config from the debian build directory or /boot if available.
          
          # However, a cleaner start for custom builds is often 'make defconfig' or using the provided debian config.
          # Debian configs are complex (split into fragments). 
          # Let's try to generate the standard Debian config first.
          
          # If debian/rules exists, we can use it to generate the config, 
          # BUT simpler is to just fetch the stock config from the repo if 'make olddefconfig' is too basic.
          wget -O .config https://salsa.debian.org/kernel-team/linux/-/raw/sid/debian/config/amd64/config.amd64_none_amd64
          
          # Set a custom local version to identify this build
          scripts/config --set-str LOCALVERSION "-cloud-custom"
          
          # Normalize the config
          make olddefconfig

      - name: Apply Custom Config (config.sh)
        run: |
          cd linux-src
          
          # Copy config.sh from your repo to the source dir
          cp ../config.sh .
          chmod +x config.sh
          
          echo "Applying config.sh..."
          ./config.sh
          
          # Finalize config again after script changes
          make olddefconfig

      - name: Build Kernel (Debian Package)
        run: |
          cd linux-src
          
          # Disable debug info to save massive amounts of time and space (optional but recommended for cloud)
          scripts/config --disable DEBUG_INFO
          scripts/config --disable DEBUG_INFO_BTF
          scripts/config --enable DEBUG_INFO_NONE
          
          # Build binary packages (headers and image)
          # bindeb-pkg is the upstream kernel target that builds .deb packages
          make -j$(nproc) bindeb-pkg LOCALVERSION=-cloud-custom

          # Move artifacts
          mkdir -p ../build-artifacts
          mv ../*.deb ../build-artifacts/
          mv ../*.changes ../build-artifacts/ 2>/dev/null || true
          mv ../*.buildinfo ../build-artifacts/ 2>/dev/null || true

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debian-trixie-cloud-kernel
          path: build-artifacts/*
          compression-level: 0

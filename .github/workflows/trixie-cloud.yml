name: Build Debian Trixie Cloud Kernel

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-debian-trixie-cloud.yml"
      - "config.sh"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          set -eux
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android || true
          docker system prune -af || true
          df -h

      - name: Build Debian trixie cloud kernel in container
        run: |
          set -euxo pipefail
          chmod +x config.sh

          docker run --rm \
            -e DEBIAN_FRONTEND=noninteractive \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            debian:trixie \
            bash -euxo pipefail -c '
              # Ensure official Debian trixie repos (binary + source)
              cat > /etc/apt/sources.list <<EOF
              deb http://deb.debian.org/debian trixie main
              deb-src http://deb.debian.org/debian trixie main
              EOF

              apt-get update
              apt-get install -y --no-install-recommends \
                ca-certificates \
                build-essential fakeroot devscripts dpkg-dev \
                bc bison flex kmod cpio rsync file git \
                xz-utils zstd quilt python3 \
                libelf-dev libssl-dev libncurses-dev dwarves

              # Install Debian kernel build dependencies and fetch official Debian source
              apt-get build-dep -y linux
              apt-get source linux

              SRC_DIR="$(find . -maxdepth 1 -type d -name "linux-*" | sort | head -n1)"
              test -n "$SRC_DIR"
              cd "$SRC_DIR"

              export DEB_RULES_REQUIRES_ROOT=no
              export DEB_BUILD_PROFILES="pkg.linux.nokerneldbg pkg.linux.nokerneldbginfo"
              export MAKEFLAGS="-j$(nproc)"

              ARCH=amd64
              FEATURESET=none
              FLAVOUR=cloud
              SETUP_TARGET="setup_${ARCH}_${FEATURESET}_${FLAVOUR}"
              BUILD_TARGET="binary-arch_${ARCH}_${FEATURESET}_${FLAVOUR}"
              BUILD_DIR="debian/build/build_${ARCH}_${FEATURESET}_${FLAVOUR}"

              # Prepare Debian patched source and cloud flavour config
              debian/rules source
              make -f debian/rules.gen "${SETUP_TARGET}"

              # Apply your repo config.sh exactly like the original repo flow idea
              cp "${BUILD_DIR}/.config" .config
              bash /work/config.sh
              cp .config "${BUILD_DIR}/.config"

              # Resolve any new symbols after config tweaks
              make O="${BUILD_DIR}" olddefconfig

              # Build only cloud flavour packages
              make -f debian/rules.gen "${BUILD_TARGET}"

              # Optional: build indep common headers package (ignore failure if not needed)
              make -f debian/rules.gen binary-indep_none || true

              # Copy outputs back to workspace root
              cp -vf ../*.deb /work/ || true
              cp -vf ../*.changes /work/ || true
              cp -vf ../*.buildinfo /work/ || true
            '

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debian-trixie-cloud-kernel
          path: |
            *.deb
            *.changes
            *.buildinfo
            linux-*/debian/build/build_amd64_none_cloud/.config
          if-no-files-found: warn

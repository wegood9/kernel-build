name: Build Debian Trixie Cloud Kernel

on:
  workflow_dispatch:
    inputs:
      kernel_source_pkg:
        description: "Debian kernel source package name"
        required: false
        default: "linux"

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie

    defaults:
      run:
        shell: bash

    env:
      DEBIAN_FRONTEND: noninteractive
      DEB_BUILD_OPTIONS: nocheck
      DEB_BUILD_PROFILES: pkg.linux.nokerneldbg pkg.linux.nokerneldbginfo
      DEB_RULES_REQUIRES_ROOT: "no"
      KERNEL_SOURCE_PKG: ${{ github.event.inputs.kernel_source_pkg || 'linux' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare apt sources and install build deps
        run: |
          set -euo pipefail

          # Ensure deb-src is enabled (needed by apt build-dep / apt source)
          if [[ -f /etc/apt/sources.list.d/debian.sources ]]; then
            sed -i 's/^Types: deb$/Types: deb deb-src/g' /etc/apt/sources.list.d/debian.sources || true
          fi

          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates gnupg dirmngr \
            build-essential fakeroot devscripts equivs \
            bc bison flex libssl-dev libelf-dev dwarves cpio rsync kmod pkg-config \
            python3 quilt ccache git wget xz-utils

          # Pull build dependencies for Debian kernel source package
          apt-get build-dep -y "${KERNEL_SOURCE_PKG}"

      - name: Download Debian kernel source
        run: |
          set -euo pipefail

          # Download source package into workspace
          apt-get source "${KERNEL_SOURCE_PKG}"

          SRC_DIR="$(find . -maxdepth 1 -mindepth 1 -type d -name 'linux-*' | sort -V | tail -n1)"
          [[ -n "${SRC_DIR}" ]] || { echo "ERROR: linux-* source dir not found"; exit 1; }
          [[ -f "${SRC_DIR}/debian/rules" ]] || { echo "ERROR: debian/rules missing in ${SRC_DIR}"; exit 1; }

          echo "SRC_DIR=${SRC_DIR}" >> "${GITHUB_ENV}"
          echo "PKG_DIR=$(pwd)" >> "${GITHUB_ENV}"
          echo "Resolved SRC_DIR=${SRC_DIR}"

      - name: Patch config.sh persistently (delete BBR/HZ rules)
        run: |
          set -euo pipefail

          [[ -f config.sh ]] || { echo "ERROR: config.sh not found at repo root"; exit 1; }

          cp -v config.sh config.sh.bak

          # Delete ANY lines containing these exact tokens
          sed -i -E '/(^|[[:space:]])CONFIG_BBR([[:space:]]|$)/d' config.sh
          sed -i -E '/(^|[[:space:]])CONFIG_HZ_1000([[:space:]]|$)/d' config.sh
          sed -i -E '/(^|[[:space:]])CONFIG_HZ_250([[:space:]]|$)/d' config.sh

          chmod +x config.sh

          echo "Sanity check (should print nothing):"
          grep -nE 'CONFIG_BBR|CONFIG_HZ_1000|CONFIG_HZ_250' config.sh && {
            echo "ERROR: forbidden tokens still present in config.sh"
            exit 1
          } || true

          # Use patched config.sh in source tree
          cp -v config.sh "${SRC_DIR}/config.sh"
          chmod +x "${SRC_DIR}/config.sh"

      - name: Apply config.sh
        run: |
          set -euo pipefail
          cd "${SRC_DIR}"
          bash ./config.sh

      - name: Clean tree before Debian packaging
        run: |
          set -euo pipefail
          cd "${SRC_DIR}"

          # Avoid "source tree is not clean" failures
          make mrproper || true
          fakeroot debian/rules clean || true

      - name: Build cloud kernel (with fallback)
        run: |
          set -euo pipefail
          cd "${SRC_DIR}"
          export MAKEFLAGS="-j$(nproc)"

          # Regenerate packaging metadata from debian/config/*
          make -f debian/rules source

          BUILT=0
          for TARGET in \
            binary-arch_amd64_none_cloud-amd64 \
            binary-arch_amd64_none_cloud \
            binary-arch_amd64_none_amd64
          do
            echo "Trying target: ${TARGET}"
            if make -f debian/rules.gen "${TARGET}"; then
              BUILT=1
              echo "BUILD_TARGET=${TARGET}" >> "${GITHUB_ENV}"
              break
            fi
          done

          if [[ "${BUILT}" -ne 1 ]]; then
            echo "Cloud target not matched; fallback to dpkg-buildpackage -B"
            dpkg-buildpackage -B -uc -us
            echo "BUILD_TARGET=dpkg-buildpackage -B" >> "${GITHUB_ENV}"
          fi

      - name: Collect artifacts
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cd "${PKG_DIR}"

          shopt -s nullglob

          # Preferred: cloud flavor packages
          for f in \
            linux-image-*cloud*amd64*.deb \
            linux-headers-*cloud*amd64*.deb \
            linux-libc-dev_*amd64*.deb \
            *.buildinfo \
            *.changes
          do
            [[ -e "$f" ]] && mv -v "$f" artifacts/
          done

          # Fallback: generic linux packages
          if ! compgen -G "artifacts/*.deb" > /dev/null; then
            echo "No cloud-filtered .deb found; collecting generic linux .deb files."
            for f in linux-image-*.deb linux-headers-*.deb linux-libc-dev_*.deb; do
              [[ -e "$f" ]] && mv -v "$f" artifacts/
            done
          fi

          # Save patched/original config.sh for verification
          cp -v config.sh artifacts/config.sh.patched
          [[ -f config.sh.bak ]] && cp -v config.sh.bak artifacts/config.sh.original || true

          # Export one generated .config (best effort)
          find "${SRC_DIR}/debian/build" -type f -name '.config' -print -quit | while read -r cfg; do
            cp -v "$cfg" "artifacts/config-${GITHUB_RUN_ID}"
          done || true

          ls -lah artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debian-trixie-cloud-kernel-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error

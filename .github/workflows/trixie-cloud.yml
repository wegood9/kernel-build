name: Build Debian Trixie Cloud Kernel

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'config.sh'
      - '.github/workflows/debian-trixie-cloud.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    container: debian:trixie  # Use Trixie container to ensure correct build environment
    
    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          apt-get update
          apt-get install -y build-essential fakeroot libncurses-dev bison flex libssl-dev libelf-dev \
          dwarves git bc rsync wget ca-certificates debhelper python3 kmod cpio \
          pahole kernel-wedge
          
          # Install dependencies specifically for Debian kernel packaging
          apt-get install -y linux-source

      - name: Fetch Debian Trixie Kernel Source
        run: |
          echo "Cloning Debian Kernel Team source..."
          # Clone the specific branch for Trixie (usually master or a specific codename branch)
          git clone --depth=1 https://salsa.debian.org/kernel-team/linux.git -b master linux-src
          
          # Alternatively, if you want the exact upstream stable version used in Trixie:
          # wget https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.12.tar.xz
          # tar -xf linux-6.12.tar.xz
          # mv linux-6.12 linux-src

      - name: Prepare Cloud Configuration
        run: |
          cd linux-src
          
          # Method 1: Fetch config from Debian Salsa (Official Config)
          # Debian cloud kernels are typically standard configs with specific modules enabled/disabled
          # We grab the 'amd64' config. In Debian, 'cloud' is often a flavor of the main image 
          # or handled via specific fragments. Here we use the standard amd64 config as base.
          wget -O .config https://salsa.debian.org/kernel-team/linux/-/raw/master/debian/config/amd64/config.amd64_none_amd64
          
          # Explicitly set it to cloud-localversion to distinguish it
          scripts/config --set-str LOCALVERSION "-cloud-custom"
          
          # Ensure we have a valid config before customization
          make olddefconfig

      - name: Apply Custom Config (config.sh)
        run: |
          cd linux-src
          
          # Copy config.sh from the checkout to the source dir
          cp ../config.sh .
          chmod +x config.sh
          
          echo "Applying config.sh..."
          ./config.sh
          
          # Finalize config
          make olddefconfig

      - name: Build Kernel (Debian Package)
        run: |
          cd linux-src
          
          # Build binary packages (headers and image)
          # -j$(nproc) uses all available cores
          # bindeb-pkg builds the source and binary .deb packages
          make -j$(nproc) bindeb-pkg LOCALVERSION=-cloud-custom KDEB_PKGVERSION=$(make kernelversion)-1

          # Move artifacts to a clean directory for upload
          mkdir -p ../build-artifacts
          mv ../*.deb ../build-artifacts/
          mv ../*.changes ../build-artifacts/ 2>/dev/null || true
          mv ../*.buildinfo ../build-artifacts/ 2>/dev/null || true

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debian-trixie-cloud-kernel
          path: build-artifacts/*
          compression-level: 0 # Faster upload since .deb is already compressed
